# He giant 14p5M_widebinary_profile14 (Wu; MESA approx21), the STANDARD scheme.
# L, M, R_ph from the MESA header; GM = G_code x M_MESA (as hg145 ic2); wall 8 Rsun (radiative in
# MESA, CZ base 19.4 Rsun), column bottom 7 Rsun.  Composition = hg145 TOPS mixture (X 9.496e-4,
# Z 0.02153, a_metal 1.8047 fully ionized metals).  TOPS for this mixture is NOT available
# (LANL down 10-15): INTERIM = TOPS of the old He giant surface mixture (Y 0.971 Z 0.029).
name: hegiant_14p5M_global
mode: global            # VALIDATION of mode global against MESA (not the production IC)
allow_outside_tables: true   # validation only: report (not FATAL) a column that leaves the tables
report_radii_rsun: [25.0]
mlt: {use_mltpp: true}  # MESA defaults otherwise (alpha 2, Cox, alt H_p, gated MLT++)
star: {L: mesa, R_ph: mesa, M: mesa}
composition:
  X: 9.496e-4
  Y: 0.97752
  Z: 0.0215304
  a_metal: 1.8047
  mixture: custom
  saha_mixture: "3.82309e-03 h 9.91068e-01 he 8.73340e-05 c 3.76382e-03 n 1.01567e-04 o 3.05414e-04 ne 7.46004e-06 na 4.95870e-04 mg 1.02977e-05 al 1.23806e-04 si 9.83425e-07 p 7.46004e-05 s 1.10342e-06 cl 8.76476e-06 ar 4.59982e-07 k 7.99358e-06 ca 3.65377e-07 ti 1.63208e-06 cr 8.56529e-07 mn 1.10342e-04 fe 2.90229e-07 co 6.20498e-06 ni"   # the star's mixture (hg145 mixture_hg145.txt) for the Saha-es extension
  tops_mixture: "9.92685e-01 he 1.64551e-03 c 3.47644e-03 n 6.67545e-04 o 6.67126e-04 ne 7.52232e-06 na 5.00027e-04 mg 1.03837e-05 al 1.24840e-04 si 9.91635e-07 p 7.52232e-05 s 1.11263e-06 cl 8.83794e-06 ar 4.63823e-07 k 8.06031e-06 ca 3.68427e-07 ti 1.64571e-06 cr 8.63680e-07 mn 1.11263e-04 fe 2.92652e-07 co 6.25678e-06 ni 1.40072e-07 zn"
mesa_profile:
  path: /raven/ptmp/jinma/ic_star_cache/raw/mesa/14p5M_widebinary_profile14.data
  format: mesa
opacity:
  tops_hi: /raven/ptmp/jinma/ic_star_cache/raw/tops/hegiant_surf_hi.dat
r_in: {rule: explicit, r_rsun: 8.0, bottom_rsun: 6.0}   # bottom: the code needs x1min - ~5 dr(wall) (hg145 31206125: 6.68)
grid: {rho_lo: 1.0e-13, rho_hi: 3.0e-7}
